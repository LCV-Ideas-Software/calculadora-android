name: CI

# Compila, analisa e testa o projeto Android em cada pull request e em cada
# push para `main`.
#
# Por que este workflow existe (CALANDR-10): o `README.md` exige que a
# introdução do scaffold Android traga, na mesma mudança revisada, validação do
# Gradle Wrapper, lint, testes, build e análise adequada a Java/Kotlin. O
# scaffold entrou em 17/09/2026 pela CALANDR-8 e trouxe apenas duas dessas
# peças — validação do wrapper e build — e ainda assim dentro do
# `publish-play.yml`, que roda por `workflow_dispatch`. Na prática, nenhum pull
# request deste repositório era compilado.
#
# O momento importa: isto precisa existir ANTES do primeiro Kotlin, porque o
# primeiro Kotlin é o motor de cálculo — a parte que lida com dinheiro e que
# não pode entrar sem nada que a compile e a teste automaticamente.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
    # Inclui pull requests reapontados e marcados como prontos, para que este
    # check exigido também corra nesses casos.
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Check out the repository.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # Mesma versão usada pelo `publish-play.yml`. Compilar aqui com um JDK
          # diferente do que publica tornaria este check uma prova sobre outro
          # ambiente que não o de release.
          java-version: "17"

      - name: Validate the Gradle wrapper
        # Recusa um wrapper cujo checksum não corresponda a uma distribuição
        # publicada do Gradle. Já existe no fluxo de publicação; aqui passa a
        # valer para todo pull request, que é onde um wrapper adulterado
        # entraria.
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Lint
        # Executado em passo próprio, e não como parte de `build`, para que a
        # falha diga qual portão reprovou sem exigir leitura do log inteiro.
        run: ./gradlew :app:lintDebug :app:lintRelease --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm

      # `:teste-release` drives the R8-minified build (`minificado`) from outside
      # its process with UI Automator: the debug tests above use fakes and
      # cannot catch what R8 breaks at run time (CALANDR-26).
      # `--max-workers=1`: each module starts its own managed emulator, and two at
      # once compete for the runner; locally, the second one times out. After the
      # API 36 image came in, the `:app` tests failed on both pushes to `main`,
      # with `:core:data` and `:app` starting in the same second. maestro-android
      # runs one at a time for the same reason (CALANDR-41). `--continue` still
      # runs the other modules after one fails, so the reports kept below cover
      # all three.
      - name: Instrumented tests on Android 16
        id: instrumented
        run: >-
          ./gradlew :core:data:pixel2api36DebugAndroidTest :app:pixel2api36DebugAndroidTest
          :teste-release:pixel2api36MinificadoAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --max-workers=1 --continue --no-daemon --stacktrace

      # Gradle does not fail on a skipped test, so this check is green whether the
      # live-quote flow ran or was skipped, and the job log carries no logcat. The
      # `:teste-release` report records each flow as passed, failed or skipped, and
      # its per-test logcat holds the quote-source probes; every run keeps it,
      # failed runs included (CALANDR-28). `!cancelled()` is the documented
      # alternative to `always()` for running regardless of the outcome.
      - name: Keep the minified-build test report
        if: ${{ !cancelled() && steps.instrumented.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teste-release-report
          path: |
            teste-release/build/outputs/androidTest-results/managedDevice/
            teste-release/build/reports/androidTests/managedDevice/
          if-no-files-found: error

      # The `:core:data` and `:app` results too, failed runs included: the job
      # log only says that a module failed, not which test (CALANDR-41).
      - name: Keep the instrumented test results
        if: ${{ !cancelled() && steps.instrumented.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-test-results
          path: |
            core/data/build/outputs/androidTest-results/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
          if-no-files-found: error
