name: Record a Play release on GitHub

# Grava a GitHub Release de uma versão que JÁ está no Google Play, sem
# reconstruir e sem reenviar nada.
#
# Existe porque a primeira publicação de um aplicativo não é automatizável ponta
# a ponta: um aplicativo nunca publicado é um *draft app*, a API só aceita
# `status: draft` dele na trilha pública, e quem conclui é uma pessoa no Play
# Console. Quando isso acontece o `publish-play.yml` já terminou, e redisparar
# não serve — ele reconstruiria e reenviaria o mesmo `versionCode`, que a Play
# recusa. Também serve a qualquer versão promovida pelo Console.
#
# Medido em 20/09/2026: a Play disponibiliza o APK universal assim que processa
# o bundle, antes do rollout. O artefato nunca é o que atrasa; o que decide
# quando gravar é a política de só gravar Release do que a loja entrega.
#
# A tag aponta para o commit que a Play recebeu, e quem diz qual é esse commit é
# o run do `publish-play.yml` que enviou a versão, informado no disparo
# (CALANDR-33). Antes a tag ia para `$GITHUB_SHA`, o commit em que este workflow
# rodava, e a única trava comparava o `versionCode`. Só que `main` continua
# recebendo merges depois de uma versão sem mudar o `versionCode`: medido em
# 03/10/2026, a Play construiu a 1.0.2 em `826e519` e `main` já estava em
# `f13f4a7`, ainda no código 4. Disparado em `main`, este workflow teria gravado
# a tag em `f13f4a7`, um commit que a Play nunca construiu. Tag e Release são
# imutáveis, então o commit vem do run de publicação, nunca do ref do disparo.
#
# Usa a mesma configuração do `publish-play.yml`: WIF, sem chave guardada.

on:
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: >-
          ID do run de "Publish to Google Play" que enviou esta versão — o número
          no fim da URL do run (…/actions/runs/<ID>)
        required: true
        type: string
      version_code:
        description: versionCode já publicado no Google Play
        required: true
        type: string

permissions: {}

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  record:
    name: Fetch the Play-signed APK and record the Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read # Ler o run de publicação informado e conferir de onde ele veio.
      contents: write # Criar a tag, a Release e anexar os assets.
      id-token: write # Token OIDC: credenciais do Google e assinatura Sigstore.
      attestations: write # Guardar a attestation neste repositório.
    steps:
      - name: Identify the commit Google Play received
        id: publish
        # O run informado só serve se for do `publish-play.yml` deste
        # repositório — conferido pelo caminho do arquivo, porque o nome exibido
        # é texto livre — e se terminou com sucesso. Todo caminho bem-sucedido
        # daquele workflow passa pelo envio do bundle e pela comparação de
        # digest, e a Play recusa um `versionCode` repetido; então um run
        # bem-sucedido prova que o bundle daquele código saiu do seu `head_sha`.
        # A API não expõe os inputs do run (`track`, `release_status`): quem
        # prova que a versão está em produção e publicada continuam sendo as
        # consultas à Play, mais abaixo. Nada é escrito antes de tudo isso.
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RUN_ID: ${{ inputs.publish_run_id }}
          PUBLISH_WORKFLOW: .github/workflows/publish-play.yml
        run: |
          set -euo pipefail
          # O ID entra no caminho da chamada à API, então só dígitos.
          if ! [[ "$PUBLISH_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::publish_run_id deve ter só dígitos: o número no fim da URL do run de publicação." >&2
            exit 1
          fi
          if ! run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISH_RUN_ID"); then
            echo "::error::Não foi possível ler o run $PUBLISH_RUN_ID neste repositório." >&2
            exit 1
          fi
          campo() { printf '%s' "$run" | jq -r "$1 // empty"; }
          repo=$(campo .repository.full_name)
          path=$(campo .path)
          status=$(campo .status)
          conclusion=$(campo .conclusion)
          head_sha=$(campo .head_sha)
          if [ "$repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::O run $PUBLISH_RUN_ID é do repositório '$repo', e não de $GITHUB_REPOSITORY." >&2
            exit 1
          fi
          if [ "$path" != "$PUBLISH_WORKFLOW" ]; then
            echo "::error::O run $PUBLISH_RUN_ID é do workflow '$path', e não de $PUBLISH_WORKFLOW." >&2
            exit 1
          fi
          if [ "$status" != completed ]; then
            echo "::error::O run $PUBLISH_RUN_ID ainda não terminou (status '$status')." >&2
            exit 1
          fi
          if [ "$conclusion" != success ]; then
            echo "::error::O run $PUBLISH_RUN_ID terminou com '$conclusion'; só um run bem-sucedido prova que a Play recebeu o bundle daquele commit." >&2
            exit 1
          fi
          if ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::O run $PUBLISH_RUN_ID não informou um head_sha válido ('$head_sha')." >&2
            exit 1
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Check out the commit Google Play received
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.publish.outputs.head_sha }}
          persist-credentials: false

      - name: Verify required configuration
        env:
          PLAY_PACKAGE_NAME: ${{ vars.PLAY_PACKAGE_NAME }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          GCP_QUOTA_PROJECT: ${{ vars.GCP_QUOTA_PROJECT }}
        run: |
          set -euo pipefail
          missing=""
          for name in PLAY_PACKAGE_NAME WIF_PROVIDER PLAY_SERVICE_ACCOUNT GCP_QUOTA_PROJECT; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository configuration:$missing."
            exit 1
          fi

      - name: Derive the tag and check it against the sources
        id: version
        # A tag vem do `versionName` do commit que a Play recebeu, como no
        # `publish-play.yml`. O checkout tem de estar nesse commit, e o
        # `versionCode` dele tem de bater com o informado: é uma segunda prova,
        # independente do ID do run, de que o run escolhido é o da versão
        # pretendida. Gravar a Release de uma versão com o nome de outra seria
        # pior que não gravar.
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
        run: |
          set -euo pipefail
          checked_out=$(git rev-parse HEAD)
          if [ "$checked_out" != "$HEAD_SHA" ]; then
            echo "::error::O checkout está em $checked_out, e não no commit do run de publicação ($HEAD_SHA)."
            exit 1
          fi
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::versionName must be MAJOR.MINOR.PATCH; found '$name'."
            exit 1
          fi
          if [ "$code" != "$VERSION_CODE" ]; then
            echo "::error::O commit $HEAD_SHA do run de publicação está no versionCode $code e foi pedido o $VERSION_CODE. Confira o ID do run e o versionCode informados."
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$name"
          tag=$(printf 'v%02d.%02d.%02d' "$major" "$minor" "$patch")
          # Uma versão já gravada é recusada aqui, antes da autenticação no Google
          # e da attestation: um disparo repetido não pode deixar nada público. A
          # mesma conferência se repete na criação, contra disparos simultâneos.
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$tag" > /dev/null; then
            echo "::error::A tag $tag já existe; esta versão já foi gravada."
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::Não foi possível verificar a existência da tag (git: $status)."
              exit 1
            fi
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_QUOTA_PROJECT }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Download the Play-signed universal APK
        id: apk
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          QUOTA_PROJECT: ${{ vars.GCP_QUOTA_PROJECT }}
          PACKAGE: ${{ vars.PLAY_PACKAGE_NAME }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          api=https://androidpublisher.googleapis.com/androidpublisher/v3/applications

          # Guardar corpo e status: um diagnóstico na saída padrão morre onde a
          # chamada a redireciona, e um HTTP 400 vira "curl: (22)" e nada mais.
          play() {
            local rotulo=$1; shift
            local corpo status
            corpo=$(mktemp)
            status=$(curl -sS --connect-timeout 10 --max-time 120 -o "$corpo" -w '%{http_code}' "$@") || {
              echo "::error::$rotulo: curl falhou." >&2
              sed 's/^/  /' "$corpo" >&2; rm -f "$corpo"; return 1
            }
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::error::$rotulo: o Google Play respondeu HTTP $status." >&2
              sed 's/^/  /' "$corpo" >&2; rm -f "$corpo"; return 1
            fi
            cat "$corpo"; rm -f "$corpo"
          }

          auth=(-H "Authorization: Bearer $TOKEN" -H "x-goog-user-project: $QUOTA_PROJECT")
          # Generated APKs exist before publication; only an active production
          # release proves that this version is being served. Discard this read edit.
          edit=$(play "abrir consulta da trilha" "${auth[@]}" -X POST \
            -H 'Content-Type: application/json' -d '{}' "$api/$PACKAGE/edits" | jq -er '.id')
          trap 'curl -sS --max-time 30 -X DELETE "${auth[@]}" "$api/$PACKAGE/edits/$edit" >/dev/null' EXIT
          track=$(play "consultar production" "${auth[@]}" "$api/$PACKAGE/edits/$edit/tracks/production")
          if ! printf '%s' "$track" | jq -e --arg code "$VERSION_CODE" \
            'any(.releases[]?; ((.versionCodes // []) | index($code)) != null and (.status == "completed" or (.status == "inProgress" and .userFraction > 0)))' >/dev/null; then
            echo "::error::O versionCode solicitado não está em distribuição na trilha production."
            exit 1
          fi
          play "encerrar consulta" "${auth[@]}" -X DELETE "$api/$PACKAGE/edits/$edit" >/dev/null
          trap - EXIT
          lifecycle=$(play "consultar publicação efetiva" "${auth[@]}" "$api/$PACKAGE/tracks/production/releases")
          if ! printf '%s' "$lifecycle" | jq -e --argjson code "$VERSION_CODE" \
            'any(.releases[]?; .releaseLifecycleState == "RELEASE_LIFECYCLE_STATE_PUBLISHED" and any(.activeArtifacts[]?; .versionCode == $code))' >/dev/null; then
            echo "::error::Esta versão ainda não foi aprovada e publicada na Play. Nenhuma GitHub Release será criada."
            exit 1
          fi
          gen="$api/$PACKAGE/generatedApks/$VERSION_CODE"

          listing=$(play "listar os APKs gerados" "${auth[@]}" "$gen")
          universal='[.generatedApks[]? | select(.generatedUniversalApk != null)][0]'
          download_id=$(printf '%s' "$listing" | jq -r "$universal.generatedUniversalApk.downloadId // empty")
          if [ -z "$download_id" ]; then
            echo "::error::O Google Play não tem APK universal para o versionCode $VERSION_CODE."
            exit 1
          fi
          cert=$(printf '%s' "$listing" | jq -r "$universal.certificateSha256Hash // \"unknown\"")

          mkdir -p release
          apk="release/$PACKAGE-$VERSION_NAME.apk"
          play "baixar o APK universal" "${auth[@]}" "$gen/downloads/$download_id:download?alt=media" > "$apk"
          if [ ! -s "$apk" ]; then
            echo "::error::O APK universal do versionCode $VERSION_CODE veio vazio."
            exit 1
          fi
          aapt=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -1)
          apksigner="$ANDROID_HOME/build-tools/37.0.0/lib/apksigner.jar"
          metadata=$("$aapt" dump badging "$apk" | sed -n '1p')
          if [[ "$metadata" != *"name='$PACKAGE'"* || "$metadata" != *"versionCode='$VERSION_CODE'"* || "$metadata" != *"versionName='$VERSION_NAME'"* ]]; then
            echo "::error::O pacote/versão do APK não corresponde à publicação solicitada."
            exit 1
          fi
          # Verify every supported signature, including Android 17 ML-DSA.
          "$JAVA_HOME_25_X64/bin/java" --enable-native-access=ALL-UNNAMED -jar "$apksigner" \
            verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-verification.txt"
          expected_cert=${cert//:/}
          expected_cert=${expected_cert,,}
          actual_certs=$(sed -n -E '/^(Signer #[0-9]+|V[0-9.]+ Signer:|V[0-9.]+ Hybrid (Classical|PQC) Signer:).*certificate SHA-256 digest: /s/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-verification.txt" | tr 'A-F' 'a-f')
          if ! [[ "$expected_cert" =~ ^[0-9a-f]{64}$ ]] || ! grep -Fxq "$expected_cert" <<< "$actual_certs"; then
            echo "::error::O certificado do APK não corresponde ao certificado informado pela Play."
            exit 1
          fi
          (cd release && sha256sum "$(basename "$apk")" > SHA256SUMS)

          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "certificate=$cert" >> "$GITHUB_OUTPUT"

      - name: Attest the APK provenance
        # Só `subject-path`, como no `publish-play.yml`: a action monta a
        # provenance de build sozinha. Declarar `predicate-type` de SLSA com um
        # `predicate` vazio faz o GitHub recusar com *"build definition is nil"*,
        # porque a provenance exige um `buildDefinition` — medido no run
        # 35522306341.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.apk.outputs.path }}

      - name: Create the Release
        # Rascunho primeiro, assets depois, publicar por último: é a ordem que
        # releases imutáveis exigem, porque nada se acrescenta a uma publicada.
        # O alvo é o commit do run de publicação, e não `$GITHUB_SHA`: este
        # workflow pode ser disparado em qualquer ref.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ inputs.version_code }}
          CERT: ${{ steps.apk.outputs.certificate }}
          PACKAGE: ${{ vars.PLAY_PACKAGE_NAME }}
          HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
          PUBLISH_RUN_ID: ${{ inputs.publish_run_id }}
        run: |
          set -euo pipefail
          {
            cat play/release-notes/pt-BR.txt
            echo ""
            echo "---"
            echo ""
            echo "Binário distribuído pelo Google Play. O APK universal anexado é o que a"
            echo "própria Play gerou e assinou com a chave de assinatura do aplicativo, então"
            echo "instala ao lado de uma instalação da loja e se atualiza com ela."
            echo ""
            echo "- pacote: \`$PACKAGE\`"
            echo "- versionName: \`$VERSION_NAME\` — versionCode: \`$VERSION_CODE\`"
            echo "- certificado de assinatura (SHA-256): \`$CERT\`"
            echo ""
            echo "Proveniência verificável com \`gh attestation verify\`."
          } > corpo.md

          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" > "$RUNNER_TEMP/existing-tag"; then
            echo "::error::A tag $TAG já existe; não reutilizar proveniência sem conferir a publicação existente."
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::Não foi possível verificar a existência da tag (git: $status)."
              exit 1
            fi
          fi
          gh release create "$TAG" --target "$HEAD_SHA" --draft --title "$VERSION_NAME" --notes-file corpo.md
          gh release upload "$TAG" release/*.apk release/SHA256SUMS
          gh release edit "$TAG" --draft=false
          {
            echo "### Release \`$TAG\` gravada"
            echo ""
            echo "- commit \`$HEAD_SHA\`, enviado à Play pelo run \`$PUBLISH_RUN_ID\`"
            echo "- APK universal assinado pela Play, certificado \`$CERT\`"
            echo "- \`SHA256SUMS\` e attestation de proveniência"
          } >> "$GITHUB_STEP_SUMMARY"
