<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta
      name="description"
      content="Preparação técnica da Calculadora Android da LCV Ideas &amp; Software."
    />
    <link rel="canonical" href="https://calculadora-android.lcv.dev/" />
    <title>Calculadora Android — LCV Ideas &amp; Software</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        line-height: 1.5;
        background: #07111f;
        color: #f3f7fc;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: radial-gradient(circle at top, #14532d, #07111f 58%);
      }
      main {
        width: min(46rem, 100%);
        padding: clamp(2rem, 7vw, 4rem);
        border: 1px solid #2f6b4a;
        border-radius: 1.5rem;
        background: rgb(8 23 41 / 92%);
        box-shadow: 0 2rem 5rem rgb(0 0 0 / 35%);
      }
      p { color: #c8d8e9; }
      .eyebrow {
        color: #86efac;
        font-weight: 750;
        letter-spacing: .12em;
        text-transform: uppercase;
      }
      h1 {
        margin: .25rem 0 1rem;
        font-size: clamp(2.3rem, 9vw, 4.5rem);
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">LCV Ideas &amp; Software</p>
      <h1>Calculadora Android</h1>
      <p>
        O repositório está em preparação técnica. Nenhuma versão do aplicativo
        Android foi publicada por esta superfície.
      </p>
    </main>
  </body>
</html>
